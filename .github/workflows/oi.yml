name: oi-collector
on:
  schedule:
    - cron: "7 * * * *"      # каждый час на 7-й минуте (UTC)
  workflow_dispatch:         # ручной запуск кнопкой
permissions:
  contents: write
concurrency:
  group: oi-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Снимок OI
        run: python3 oi_collector.py
      - name: Сохранить в репозиторий
        run: |
          git config user.name "oi-bot"
          git config user.email "oi-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "oi $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1

name: oi-collector
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oi-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Debug
        run: |
          echo "Starting"
          whoami
          pwd
      - uses: actions/checkout@v4
      - name: After checkout
        run: |
          echo "Checkout done"
          ls -la
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Снимок OI
        run: python3 oi_collector.py
      - name: Сохранить в репозиторий
        run: |
          git config user.name "oi-bot"
          git config user.email "oi-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "oi $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1
      - name: Синхронизировать в публичный репозиторий
        env:
          PUBLIC_TOKEN: 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
        run: |
          git clone https://x-access-token:${PUBLIC_TOKEN}@github.com/Scaur151/oi-data-public.git /tmp/public
          cp data/oi_*.csv /tmp/public/
          cd /tmp/public
          git config user.name "oi-bot"
          git config user.email "oi-bot@users.noreply.github.com"
          git add oi_*.csv
          git diff --cached --quiet && exit 0
          git commit -m "sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
